<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 캐시 방지: 매 로드마다 최신 HTML/JS를 받도록 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#FAF7F2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가족여행">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<title>우리 가족 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mobile.css?v=m9">
</head>
<body>
<div id="app">
  <!-- 랜딩: 가족 사진 + 여행 선택/생성 -->
  <div id="landing" class="hidden">
    <div class="ld-inner">
      <div class="ld-photo" id="ldPhoto"></div>
      <h1 class="ld-title">우리 가족 여행</h1>
      <p class="ld-sub">어디로 떠날까요?</p>
      <div class="ld-trips" id="ldTrips"></div>
      <button id="ldNewTrip" class="btn btn-ghost btn-block" type="button">✈️ 새 여행 만들기</button>
      <div class="ld-new hidden" id="ldNewForm">
        <input type="text" id="ldName" placeholder="여행 이름 (예: 도쿄 가족여행)">
        <div class="date-row"><input type="date" id="ldStart"><input type="date" id="ldEnd"></div>
        <button id="ldCreate" class="btn btn-primary btn-block" type="button">만들고 시작하기</button>
      </div>
      <p class="ld-hint">가족 사진은 [더보기] 탭에서 바꿀 수 있어요.</p>
    </div>
  </div>
  <!-- 컴팩트 헤더: 여행명 + 설정 -->
  <header id="topbar">
    <button id="tripBtn" type="button" aria-label="여행 선택">
      <span id="tripName">여행</span><span id="tripCaret">▾</span>
    </button>
    <button id="btnSettings" class="icon-btn" type="button" aria-label="설정">⚙️</button>
  </header>

  <!-- 일자 칩 -->
  <nav id="dayChips" aria-label="일자 선택"></nav>

  <div id="stage">
    <!-- 지도: 항상 마운트 유지 (탭 전환 시 재렌더링 글리치 방지) -->
    <div id="mapView">
      <div id="map"></div>
      <div id="routeInfo" class="hidden"></div>
      <!-- 지도 탭: 위치에 장소 추가 / 위치 선택 모드 배너 -->
      <div id="mapAddBar" class="map-bar hidden">
        <span>📍 이 위치에 장소 추가</span>
        <button id="mapAddOk" type="button">추가</button>
        <button id="mapAddCancel" type="button" aria-label="취소">✕</button>
      </div>
      <div id="mapPickBar" class="map-bar hidden">
        <span id="mapPickMsg">지도를 눌러 위치를 지정하세요</span>
        <button id="mapPickCancel" type="button" aria-label="취소">✕</button>
      </div>
      <div id="fabStack">
        <button id="btnRoute" class="fab" type="button" title="경로">🚗<span>경로</span></button>
        <button id="btnNearby" class="fab" type="button" title="주변 맛집">🍜<span>맛집</span></button>
        <button id="btnSearch" class="fab fab-main" type="button" title="장소 검색">🔍<span>검색</span></button>
      </div>
    </div>

    <!-- 장소 목록 바텀시트 (드래그: peek → 절반 → 전체) -->
    <section id="sheet" aria-label="일정 목록">
      <div id="sheetGrip" role="button" aria-label="시트 펼치기/접기"></div>
      <div id="sheetHead">
        <div id="sheetTitle"></div>
        <button id="btnAddPlace" class="btn btn-primary" type="button">+ 장소</button>
      </div>
      <div id="routeBar" class="hidden">
        <div class="seg" id="routeBarSeg"></div>
        <div class="rb-info">
          <span class="cnt" id="rbCount"></span>
          <div class="rb-btns">
            <button id="rbAdd" class="btn btn-ghost" type="button">➕ 다른 장소</button>
            <button id="rbExit" class="btn btn-ghost" type="button">경로 종료</button>
          </div>
        </div>
      </div>
      <div id="sheetRouteInfo" class="hidden"></div>
      <div id="placeList" class="place-list"></div>
      <div id="sheetEmpty" class="empty hidden">
        <p>아직 장소가 없어요.</p>
        <button id="btnEmptySearch" class="btn btn-primary" type="button">🔍 장소 검색으로 추가</button>
      </div>
    </section>

    <!-- 비지도 탭 콘텐츠 -->
    <main id="panelView" class="hidden">
      <div id="itinerary" class="hidden"></div>
      <div id="moveView" class="hidden"></div>
      <div id="moreView" class="hidden"></div>
    </main>
  </div>

  <!-- 하단 탭 내비 -->
  <nav id="tabbar" aria-label="하단 탭">
    <button type="button" data-tab="map" class="on"><span class="tb-ico">🗺️</span><span>지도</span></button>
    <button type="button" data-tab="list"><span class="tb-ico">📋</span><span>일정</span></button>
    <button type="button" data-tab="move"><span class="tb-ico">🚌</span><span>이동</span></button>
    <button type="button" data-tab="more"><span class="tb-ico">⋯</span><span>더보기</span></button>
  </nav>
</div>

<!-- 토스트 / 모달 / 숨김 입력 -->
<div id="toast" class="toast hidden" role="alert"></div>
<div id="modalRoot"></div>
<input type="file" id="photoInput" accept="image/*" multiple class="hidden">
<input type="file" id="familyPhotoInput" accept="image/*" class="hidden">
<input type="file" id="importInput" accept="application/json,.json" class="hidden">

<script src="js/config.js?v=m9"></script>
<script src="js/data.js?v=m9"></script>
<script src="js/storage.js?v=m9"></script>
<script src="js/maps.js?v=m9"></script>
<script src="js/report.js?v=m9"></script>
<script src="js/mobile.js?v=m9"></script>
</body>
</html>
